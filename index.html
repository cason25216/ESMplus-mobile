function translate(text){if(language==='zh')return text;const index=language==='en'?1:2;let result=text.replace(/第 (\d+) 天/g,language==='en'?'Day $1':'$1일차').replace(/为 (\d+) 件商品报名？/g,language==='en'?'Apply for $1 products?':'상품 $1개를 신청할까요?');for(const entry of orderedTranslations)result=result.split(entry[0]).join(entry[index]);if(language==='en')result=result.replace(/(\d+)万/g,(_,v)=>(Number(v)*10)+'k');if(language==='ko')result=result.replace(/万/g,'만');return result}

function localize(){document.documentElement.lang={zh:'zh-CN',en:'en',ko:'ko'}[language];document.title=translate('ESM+ Pocket · 商家经营助手');const picker=document.getElementById('language');if(picker)picker.value=language;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(['SCRIPT','STYLE'].includes(node.parentElement.tagName)||node.parentElement.parentElement?.id==='language')continue;let record=textSources.get(node);if(!record||node.nodeValue!==record.last)record={source:node.nodeValue};record.last=translate(record.source);node.nodeValue=record.last;textSources.set(node,record)}document.querySelectorAll('[aria-label]').forEach(el=>{let record=labelSources.get(el);if(!record||el.getAttribute('aria-label')!==record.last)record={source:el.getAttribute('aria-label')};record.last=translate(record.source);el.setAttribute('aria-label',record.last);labelSources.set(el,record)})}

let reportTab='daily';let page='home',saleTab='eligible',reportDay='25',selected=new Set(products.map(p=>p.id));const money=n=>'₩'+Math.round(n).toLocaleString('en-US');const finalPrice=p=>Math.round(p.price*(1-p.sd/100)*(1-p.sv/100));function save(){localStorage.setItem('esm-pocket-v1',JSON.stringify(state))}function toast(s){document.getElementById('toast').innerHTML='<div class="toast">'+translate(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3200)}
function chart(){return `<svg class="chart" viewBox="0 0 600 185" role="img" aria-label="近七日成交额趋势，10月25日成交额1286400韩元"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9e8cd" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${[25,65,105,145].map((y,i)=>`<line x1="45" y1="${y}" x2="590" y2="${y}" stroke="#edf1ed"/><text x="0" y="${y+4}">${[150,100,50,0][i]}万</text>`).join('')}<path d="M50 126L135 98L220 112L305 68L390 88L475 49L575 30L575 145L50 145Z" fill="url(#area)"/><path d="M50 137L135 117L220 122L305 100L390 109L475 83L575 91" fill="none" stroke="#cbd8d1" stroke-width="2" stroke-dasharray="5 5"/><path d="M50 126L135 98L220 112L305 68L390 88L475 49L575 30" fill="none" stroke="#16815d" stroke-width="3" stroke-linejoin="round"/><circle cx="575" cy="30" r="5" fill="#16815d" stroke="white" stroke-width="3"/>${['10.19','10.20','10.21','10.22','10.23','10.24','10.25'].map((d,i)=>`<text x="${35+i*87}" y="178">${d}</text>`).join('')}</svg>`}

function sale(){return `<div class="card campaign-intro"><div class="topline"><span class="pill">ϟ 招商中 · 11.11 PRE-SALE</span><span class="muted">报名截止 10.29</span></div><h2 style="margin:17px 0 8px">11.11 预热闪购</h2><p class="muted">活动时间 2026.11.01 — 11.07 · Gmarket Flash Sale 会场</p><details class="campaign-rules"><summary>报名要求与优惠规则</summary><div class="notice">✓ 近30日评分 ≥ 4.5　✓ 可售库存 ≥ 50 件<br>✓ 活动到手价需低于商品报名上限　✓ SD 与 SV 由商家承担</div><div class="muted">以下商品满足评分与库存要求。建议方案已预填，请核对价格与优惠后报名。<br>优惠演示规则：到手价 = 活动售价 × (1 − SD%) × (1 − SV%)，四舍五入至韩元。</div></details></div><div class="tabs"><button class="${saleTab==='eligible'?'active':''}" onclick="saleTab='eligible';render()">可报名商品 · ${state.enrolled?3-state.enrolled.length:3}</button><button class="${saleTab==='enrolled'?'active':''}" onclick="saleTab='enrolled';render()">已报名 · ${state.enrolled?state.enrolled.length:0}</button></div>${saleTab==='enrolled'?enrolled():eligible()}`}
